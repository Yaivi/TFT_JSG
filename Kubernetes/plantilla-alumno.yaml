apiVersion: v1
kind: Namespace
metadata:
  name: alumno-ALUMNO
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cuota
  namespace: alumno-ALUMNO
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
    persistentvolumeclaims: "1"
    pods: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites
  namespace: alumno-ALUMNO
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      type: Container